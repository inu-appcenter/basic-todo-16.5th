name: CI/CD

on:
  push:
    branches: [ "server" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: mkdir -p ./src/main/resources
      - run: touch ./src/main/resources/application-prod.yml
      - run: echo "${{ secrets.APPLICATION }}" > ./src/main/resources/application-prod.yml
      - run: cat ./src/main/resources/application-prod.yml

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test -i --no-daemon -Dspring.profiles.active=prod

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo:latest

      - name: Create docker-compose.yml from secret
        run: |
          touch docker-compose.yml
          echo "${{ secrets.DOCKER_COMPOSE }}" > docker-compose.yml
          sed -i "s/\${DOCKER_USERNAME}/${{ secrets.DOCKER_USERNAME }}/g" docker-compose.yml
          cat docker-compose.yml

      - name: Transfer docker-compose.yml to server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.yml"
          target: "/home/appcenter/todo"

      - name: Deploy to App Center Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/appcenter/todo
            
            # Pull the latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/todo:latest
            
            # Create environment file
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            
            # Stop and remove any existing containers
            if [ "$(docker ps -aq -f name=todo)" ]; then
              docker stop todo
              docker rm todo
            fi
            
            if [ "$(docker ps -aq -f name=todo-mysql)" ]; then
              docker stop todo-mysql
              docker rm todo-mysql
            fi
            
            # Start containers with docker-compose
            docker-compose up -d